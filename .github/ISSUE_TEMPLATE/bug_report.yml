name: 🐛 Bug Report
description: Report a broken or unexpected behavior in Stitch
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I click on X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reliably reproduce the issue.
      placeholder: |
        1. Open Stitch with `npm run dev`
        2. Navigate to the Repositories tab
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      description: How were you running Stitch when the bug occurred?
      options:
        - Web dev (npm run dev)
        - Desktop (wails dev / Stitch.app)
        - Web production
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please run `gh --version`, `go version`, and `node --version` and paste the output here.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any error messages from the browser console or terminal, or attach screenshots.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have confirmed `gh auth status` shows a valid login.
          required: true
